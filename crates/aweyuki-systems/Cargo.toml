[package]
name = "aweyuki-systems"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
sha2 = "0.10.9"
aweyuki-block = { path = "../aweyuki-block" }
aweyuki-bootimg = { path = "../aweyuki-bootimg" }
aweyuki-vab = { path = "../aweyuki-vab" }
toml = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "android")'.dependencies]
aweyuki-config = { path = "../aweyuki-config" }

[dev-dependencies]
abootimg-oxide = "0.5.2"
tempfile = "3.27.0"
