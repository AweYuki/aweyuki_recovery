[package]
name = "aweyuki-mtp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# The recovery carries no time zone files, so the rules come built in.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = { workspace = true }
aweyuki-block = { path = "../aweyuki-block" }
aweyuki-files = { path = "../aweyuki-files" }

[target.'cfg(target_os = "android")'.dependencies]
aweyuki-sys = { path = "../aweyuki-sys" }

# Folders are followed with inotify, on a computer running Linux as on the
# phone.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
zerocopy = { version = "0.8.63", features = ["derive"] }
