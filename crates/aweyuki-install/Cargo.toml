[package]
name = "aweyuki-install"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
abootimg-oxide = "0.5.2"
anyhow = { workspace = true }
cms = "0.2.3"
cpio = "0.4.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libc = { workspace = true }
liblzma = { version = "0.4.9", features = ["static"] }
lz4_flex = "0.14.0"
p256 = { version = "0.13.2", features = ["pkcs8"] }
polyfuse-kernel = "0.2.0"
rsa = "0.9.10"
sha1 = { version = "0.10.7", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
aweyuki-block = { path = "../aweyuki-block" }
aweyuki-config = { path = "../aweyuki-config" }
aweyuki-info = { path = "../aweyuki-info" }
aweyuki-sys = { path = "../aweyuki-sys" }
aweyuki-systems = { path = "../aweyuki-systems" }
aweyuki-vab = { path = "../aweyuki-vab" }
x509-cert = "0.2.5"
zerocopy = { version = "0.8.63", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
aweyuki-bootimg = { path = "../aweyuki-bootimg" }
tempfile = "3.27.0"
