# Ported from: https://github.com/GIT-LINCC/skyward-nx789j/tree/nx789j
# Nubia RedMagic 10 Pro (NX789J)

[device]
codename = "nx789j"
brand = "nubia"
model = "REDMAGIC 10 Pro"
ab = true
os_version_prop = "ro.build.version.incremental"
# The stock user recovery sepolicy enforces strict denials against /vendor/bin/*
# execution, /dev/{thp,input_agent}, /dev/smcinvoke, Binder KeyMint/Gatekeeper
# registration, and su shell transitions. Mark these four domains permissive
# while leaving the rest of the stock policy enforcing.
permissive = ["recovery", "adbd", "su", "fastbootd"]

[device.soc]
hans = "骁龙 8 至尊版"
hant = "驍龍 8 至尊版"
en = "Snapdragon 8 Elite"

[display]
width = 1216
height = 2688
density = 520
diagonal = 6.85
corner_radius = 16

[modules]
sources = ["vendor_dlkm", "vendor", "system_dlkm"]
load = ["zte_tpd"]

[[owners]]
user = "system"
group = "system"
mode = 0o666
paths = [
    "/dev/thp",
    "/dev/input_agent",
    "/sys/devices/platform/goodix_thp.0/logtofile",
]

[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# Pre-stage Goodix THP touch firmware into rootfs /data/vendor/touchscreen/fw
# before /data is decrypted and before odm_tsc starts, preferring any
# calibrated thp_cfg_9916.bin cached in persist.
[[service]]
path = "/system/bin/sh"
args = [
    "-c",
    "mkdir -p /data/vendor/touchscreen/fw /data/vendor/touchscreen/tp_logs /data/vendor/qwes && chmod 0755 /data && chmod 0771 /data/vendor && cp /vendor/firmware/goodix_firmware.bin /vendor/firmware/goodix_config.cfg /data/vendor/touchscreen/fw/ && if [ -s /mnt/vendor/persist/goodix/thp_cfg_9916.bin ]; then cp /mnt/vendor/persist/goodix/thp_cfg_9916.bin /data/vendor/touchscreen/fw/thp_cfg_9916.bin; else cp /vendor/firmware/thp_cfg_9916.bin /data/vendor/touchscreen/fw/thp_cfg_9916.bin; fi && chown -R 1000:1000 /data/vendor/touchscreen /data/vendor/qwes && chmod 0777 /data/vendor/touchscreen /data/vendor/touchscreen/tp_logs && chmod 0770 /data/vendor/touchscreen/fw && chmod 0755 /data/vendor/qwes && chmod 0664 /data/vendor/touchscreen/fw/*",
]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root"]

[[service]]
path = "/vendor/bin/odm_tsc"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "root"]
capabilities = ["SYS_NICE"]

# Kernel scheduler and memory tuning; run after touch so optional tuning writes
# cannot delay touchscreen init, and wrapped with `|| true` because recovery does
# not mount all cgroup/cpuset controllers.
[[service]]
path = "/vendor/bin/sh"
args = ["-c", "/vendor/bin/init.kernel.post_boot.sh || true"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
description = "/vendor/etc/vintf/manifest_sun.xml"
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wifimac.dat", path = "/mnt/vendor/persist/wifimac.dat" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://netcheck.ztems.com/generate_204"

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/goodix",
    "vendor/secure_element",
]

[wipe]
logs = [
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/qti-logkit",
    "/data/vendor/imslogs",
    "/data/vendor/qms_logs",
]
