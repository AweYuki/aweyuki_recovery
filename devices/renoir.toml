# Ported from: https://github.com/wannqn/skyward/tree/main
[device]
codename = "renoir"
brand = "Xiaomi"
model = "Mi 11 Lite 5G"
ab = true
soc = { hans = "高通骁龙™ 780G 移动平台", hant = "Snapdragon® 780G 行動平台", en = "Snapdragon® 780G Mobile Platform" }
os_version_prop = "ro.system.build.version.incremental"

[display]
width = 1080
height = 2400
density = 440
diagonal = 6.55
corner_radius = 48
status_x = 58.4
status_cy = 24.9
status_px = 13.8

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
load = []

[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/dev/xiaomi-touch",
    "/sys/class/touch/touch_dev/fod_press_status",
]

[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

[partitions]
mounted = ["persist", "metadata"]

[firmware]
partition = "modem"

[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system/lib64/bootstrap", "/mnt/system/lib64", "/mnt/system_ext/lib64", "/system/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.keymaster@4.1-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.1::IKeymasterDevice/default"
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.1-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.1::IBootControl/default"
user = "root"
groups = ["root"]
