# Ported from: https://github.com/7-Ice/skyward/tree/amethyst
[device]
codename = "amethyst"
brand = "Redmi"
model = "Redmi Note 14 Pro+ 5G"
ab = true
soc = { hans = "第三代骁龙®7s移动平台", hant = "Snapdragon® 7s Gen 3 行動平台", en = "Snapdragon® 7s Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# 1220 by 2712, the panel's only mode; 6.67 inches. TODO: density and
# corner_radius must be read off the phone (`wm density`, and the rounded
# corner radius in the system's DevicesAndroidOverlay for amethyst).
width = 1220
height = 2712
density = 440
diagonal = 6.67
corner_radius = 120

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The stock vendor_boot loads neither touchscreen module, so they come from
# vendor_dlkm; that partition carries focaltech_touch for the FocalTech
# panels and goodix_core for the Goodix ones, and the phone keeps whichever
# its panel needs loaded. Both are named here, as the recovery tree for this
# phone does: the one whose controller is not there fails to probe and
# leaves the other alone. xiaomi_touch is the layer above both.
load = ["xiaomi_touch", "focaltech_touch", "goodix_core"]

# TODO: only where the panel hands raw frames to the host. Told through
# Xiaomi's touch layer, the driver reports positions itself; that is what
# the 17 Ultra and the K80 do.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# TODO: what the phone's own init scripts start for the touch layer, read
# from /odm and /vendor with `aweyuki-pack described`. Not filled in yet.
# [[service]]
# path = "/odm/bin/touch_report"
# user = "system"
# groups = ["system", "uhid", "input"]
# capabilities = ["SYS_NICE"]

# The WCN6750 on PCIe, driven by qca_cld3_qca6750 over the cnss2 platform
# driver; vendor_dlkm carries the one qca_cld module the stock build ships.
[wlan]
modules = ["rfkill", "qca_cld3_qca6750"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/qca6750/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6750/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/qca6750/wlan_mac.bin", partition = "persist", path = "qca6750/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.306.0 (Android 16), whose full update package on the phone maker's
# own download server holds the 100 MB recovery partition this is built on.
[stock]
version = "OS3.0.306.0.WOPCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.306.0.WOPCNXM/amethyst-ota_full-OS3.0.306.0.WOPCNXM-user-16.0-405cc6ce1e.zip"
recovery = "a87f91a451f7add4d0558a8d79d30f58e1cfd41c354f2476e28a1f3e1c84fab4"

# qcom-hv-haptics, the one haptics module the stock vendor_boot loads.
# TODO: the waveform number and the resonance file, as on the phone.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
