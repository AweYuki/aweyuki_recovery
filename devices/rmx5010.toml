# The firmware of the WLAN chip and the apps the secure world loads for the
# secure element are on the modem partition, which the recovery mounts at
# /vendor/firmware_mnt.
# The NFC HAL of the SN100x chip, whose stack the secure element is
# reached through: without it the eSE service registers nothing, and the
# weaver and the keys that ask it wait forever.
[[service]]
path = "/odm/bin/hw/android.hardware.nfc-service.nxp"
user = "nfc"
groups = ["nfc", "drmrpc", "system"]

# The working recovery's eSE and Weaver run as root. Keep their installed
# programs and service descriptions, while matching those recovery
# credentials. CE decryption was verified on this phone with v0.10.
[[key_service]]
path = "/odm/bin/hw/android.hardware.secure_element-service.qti"
user = "root"
groups = ["nfc", "root"]
ready_timeout_secs = 45

[[key_service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp"
user = "root"
groups = ["root", "drmrpc"]
capabilities = ["WAKE_ALARM"]

# The recovery's own logd, which the stock recovery's ramdisk starts with
# libraries it leaves out: taken from the installed system instead, so what
# the phone's own programs log is kept.
[logd]
program = "/mnt/system/system/bin/logd"
event_tags = "/mnt/system/system/etc/event-log-tags"
libraries = [
    "/mnt/system/system/lib64/libbase.so",
    "/mnt/system/system/lib64/libz.so",
    "/mnt/system/system/lib64/libbinder.so",
    "/mnt/system/system/lib64/libsysutils.so",
    "/mnt/system/system/lib64/libcutils.so",
    "/mnt/system/system/lib64/libpackagelistparser.so",
    "/mnt/system/system/lib64/libprocessgroup.so",
    "/mnt/system/system/lib64/libcap.so",
    "/mnt/system/system/lib64/libutils.so",
    "/mnt/system/system/lib64/liburingutils.so",
    "/mnt/system/system/lib64/logd_flags_c_lib.so",
    "/mnt/system/system/lib64/libc++.so",
    "/mnt/system/system/lib64/liblog.so",
    "/mnt/system/system/lib64/libapexsupport.so",
    "/mnt/system/system/lib64/libvndksupport.so",
    "/mnt/system/system/lib64/libaconfig_storage_read_api_cc.so",
]

[firmware]
partition = "modem"
processors = ["3000000.remoteproc-adsp"]

# The persist partition, mounted at /mnt/vendor/persist: the secure world
# keeps what the key service needs there, and the WLAN's MAC address.
[partitions]
mounted = ["persist"]

# The measured frequency is zero before the first drive. The same driver
# exposes the device-tree period (5882 us on this phone) from the start.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
period = "/sys/class/qcom-haptics/t_lra_us"
strength = { lightest = 0.25, strongest = 0.75 }

[wlan]
modules = ["rfkill", "qca_cld3_peach", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
interface_timeout_secs = 45
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Enable only after a repository publishes verified RMX5010 images.
# System ROM updates likewise need this port's own HTTPS manifest:
# [update]
# protocol = "manifest"
# server = "<the port maintainer's actual manifest URL>"
[self_update]
enabled = false

# The partitions a backup of the baseband takes: the baseband's settings
# with the IMEI, and OPPO's own NV backups, which stand where Xiaomi keeps
# fsg and fsc.
[backup]
efs = ["modemst1", "modemst2", "oplusstanvbk_a", "oplusstanvbk_b", "oplusdycnvbk", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/goodix",
    "vendor/fingerprint",
]

# Where ColorOS keeps what the phone's programs log in the data partition.
[wipe]
logs = [
    "/data/oplus/log",
    "/data/oplus/bsplog",
    "/data/oppo/log",
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/oplus/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
