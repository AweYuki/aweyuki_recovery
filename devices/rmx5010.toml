# Ported from: https://github.com/KevinXu07/skyward/tree/rmx5010
[device]
codename = "rmx5010"
brand = "realme"
model = "realme GT7 Pro"
model_from_system = false
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.build.version.incremental"

# The phoenix watchdog the bootloader arms (phx_hlos_wd_pet_time=240 on
# the kernel command line) resets a phone whose boot does not complete in
# four minutes. The stock ramdisk's own phoenix daemon waits for a running
# system to say so, and a recovery runs none. Told directly as the recovery
# starts, in every mode, and not by a shell from the vendor partition,
# which fastboot and a super that cannot be mounted leave unmounted.
[boot]
writes = [{ path = "/proc/phoenix", value = "SET_BOOTSTAGE@ANDROID_BOOT_COMPLETED" }]

[display]
width = 1264
height = 2780
density = 450
diagonal = 6.78
# Match the 116 px display corners already verified on this phone's ROM.
# Recovery has no system compositor to apply its display corner mask.
corner_radius = 116
mask_corners = true

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The stock recovery ramdisk carries no kernel modules of its own, so the
# display stack and the touchscreen come up here: msm_drm for the panel,
# and the oplus touch layer with the Synaptics and Goodix panels a GT7 Pro
# may hold, of which the one the device tree names binds.
