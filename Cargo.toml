[workspace]
resolver = "3"
members = [
    "crates/aweyuki",
    "crates/aweyuki-config",
    "crates/aweyuki-binder",
    "crates/aweyuki-backup",
    "crates/aweyuki-block",
    "crates/aweyuki-vab",
    "crates/aweyuki-modules",
    "crates/aweyuki-omapi",
    "crates/aweyuki-programs",
    "crates/aweyuki-ui",
    "crates/aweyuki-crypto",
    "crates/aweyuki-files",
    "crates/aweyuki-info",
    "crates/aweyuki-install",
    "crates/aweyuki-mtp",
    "crates/aweyuki-net",
    "crates/aweyuki-preview",
    "crates/aweyuki-pack",
    "crates/aweyuki-sys",
    "crates/aweyuki-lp",
    "crates/aweyuki-bootimg",
    "crates/aweyuki-systems",
    "crates/aweyuki-system-init",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"

# A dependency that nothing built of its package uses stops the build: one
# that only the phone's build uses is listed among the phone's.
[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
hex = "0.4.3"
serde ={ version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
# Optimizing across crates at link time does it at the binary's level,
# for size, over the UI's own.
lto = false
codegen-units = 1
panic = "abort"
strip = true

# The UI draws every pixel of every frame; it is built for speed.
[profile.release.package.aweyuki-ui]
opt-level = 3
